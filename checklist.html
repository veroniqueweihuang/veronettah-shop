<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veronetta H. — Project Checklist</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --text-muted: #888880;
    --text-light: #BBBBB4;
    --border: #E8E8E4;
    --border-hover: #C8C8C0;
    --accent: #1A1A1A;
    --done-line: #C8C8C0;
    --note: #AAAAAA;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    padding: 0;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 4rem 2rem 6rem;
  }

  header {
    margin-bottom: 3rem;
  }

  header h1 {
    font-size: 28px;
    font-weight: normal;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 4px;
  }

  header p {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .progress {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bar {
    flex: 1;
    height: 1px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--text);
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .prog-label {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .section {
    margin-bottom: 2.5rem;
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 11px 0;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: opacity 0.1s;
  }

  .task:first-of-type { border-top: 1px solid var(--border); }
  .task:active { opacity: 0.7; }

  .check {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    border: 1px solid var(--border-hover);
    border-radius: 2px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    background: var(--surface);
  }

  .task:hover .check {
    border-color: var(--text);
  }

  .task.done .check {
    background: var(--text);
    border-color: var(--text);
  }

  .checkmark {
    opacity: 0;
    transition: opacity 0.15s;
  }

  .task.done .checkmark {
    opacity: 1;
  }

  .task-body {
    flex: 1;
  }

  .task-label {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    transition: color 0.2s;
  }

  .task.done .task-label {
    color: var(--text-light);
    text-decoration: line-through;
    text-decoration-color: var(--done-line);
  }

  .task-note {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11px;
    color: var(--note);
    margin-top: 2px;
    line-height: 1.4;
  }

  .task.done .task-note {
    color: var(--text-light);
  }

  footer {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11px;
    color: var(--text-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .reset-btn {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11px;
    color: var(--text-light);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    letter-spacing: 0.05em;
    transition: color 0.15s;
  }

  .reset-btn:hover { color: var(--text-muted); }

  @media (max-width: 480px) {
    .page { padding: 2.5rem 1.25rem 4rem; }
    header h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>Veronetta H.</h1>
    <p>Project checklist</p>
    <div class="progress">
      <div class="bar"><div class="bar-fill" id="fill"></div></div>
      <div class="prog-label" id="prog"></div>
    </div>
  </header>

  <div id="list"></div>

  <footer>
    <span>veronettah.com</span>
    <button class="reset-btn" onclick="resetAll()">reset all</button>
  </footer>

</div>

<script>
const sections = [
  {
    title: "Today — website",
    tasks: [
      { label: "Create veronettah-shop repo under veroniquehuangwei GitHub account" },
      { label: "Copy all files from veronettah.github.io/Shop into the new repo" },
      { label: "Enable GitHub Pages on the new repo" },
      { label: "Register a new domain for Veronetta H.", note: "veronettah.com or similar" },
      { label: "Add CNAME file to the repo and point it to the new domain" },
      { label: "Update DNS records with your registrar" },
      { label: "Confirm site loads correctly on the new URL", note: "Check all pages and images" },
    ]
  },
  {
    title: "This week — brand",
    tasks: [
      { label: "Write description for Shirt 02" },
      { label: "Write description for Shirt 03", note: "Match the voice of Shirt 01" },
      { label: "Check colour and typography are consistent across all three pages" },
      { label: "Decide: keep plain wordmark, or refine the logo?" },
    ]
  },
  {
    title: "Weeks 2–4 — Turkey outreach",
    tasks: [
      { label: "Write a one-page brand brief for factory conversations", note: "Who Veronetta H. is, the three shirts, what you're looking for" },
      { label: "Include moodboard and shirt photos in the brief" },
      { label: "Follow up on Istanbul contacts from December 2025" },
      { label: "Research 8–10 Turkish factories", note: "LinkedIn, İHKİB directory, Sewport" },
      { label: "Send initial outreach emails" },
    ]
  },
  {
    title: "Weeks 4–10 — samples",
    tasks: [
      { label: "Shortlist 2–3 factories based on responses" },
      { label: "Commission samples from top picks", note: "Budget €50–150 per sample — normal" },
      { label: "Receive and evaluate samples" },
      { label: "Choose factory and confirm first run quantity", note: "20–30 units per shirt to start" },
    ]
  },
  {
    title: "Weeks 10–14 — launch prep",
    tasks: [
      { label: "Photography — on-body editorial and/or product shots" },
      { label: "Integrate Stripe for payments" },
      { label: "Write returns policy and basic terms", note: "Required for EU customers" },
      { label: "Sort packaging — tissue paper, a card" },
      { label: "Final site review before opening orders" },
    ]
  },
  {
    title: "Decisions (no deadline)",
    tasks: [
      { label: "Is 'made in Turkey' part of the brand story?" },
      { label: "Direct-to-consumer only, or open to stockists?" },
      { label: "Photography: commission someone, or shoot yourself?" },
    ]
  }
];

const KEY = 'vh_checklist_v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');

let total = 0;
sections.forEach(s => total += s.tasks.length);

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function countDone() {
  return Object.values(state).filter(Boolean).length;
}

function updateProgress() {
  const done = countDone();
  const pct = Math.round((done / total) * 100);
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('prog').textContent = done + ' of ' + total;
}

function resetAll() {
  if (!confirm('Reset all ticks?')) return;
  state = {};
  save();
  document.querySelectorAll('.task.done').forEach(el => el.classList.remove('done'));
  updateProgress();
}

const list = document.getElementById('list');

sections.forEach((sec, si) => {
  const secEl = document.createElement('div');
  secEl.className = 'section';

  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  hdr.innerHTML = `<span class="section-title">${sec.title}</span><div class="section-line"></div>`;
  secEl.appendChild(hdr);

  sec.tasks.forEach((t, ti) => {
    const key = si + '-' + ti;
    const taskEl = document.createElement('div');
    taskEl.className = 'task' + (state[key] ? ' done' : '');

    taskEl.innerHTML = `
      <div class="check">
        <svg class="checkmark" width="9" height="7" viewBox="0 0 9 7" fill="none">
          <path d="M1 3.5L3.2 5.5L8 1" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="task-body">
        <div class="task-label">${t.label}</div>
        ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
      </div>`;

    taskEl.addEventListener('click', () => {
      const isDone = taskEl.classList.toggle('done');
      state[key] = isDone;
      save();
      updateProgress();
    });

    secEl.appendChild(taskEl);
  });

  list.appendChild(secEl);
});

updateProgress();
</script>
</body>
</html>
